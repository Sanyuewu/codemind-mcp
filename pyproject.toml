[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codemind"]

[project]
name = "codemind-mcp"
version = "0.1.0"
description = "Local MCP server for semantic code search over private repositories (BM25 + BGE-M3 + reranker)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.27.1",
    "pydantic-settings>=2.14.1",
    "qdrant-client>=1.18.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=5.5.0",
    "sqlalchemy>=2.0.49",
    "structlog>=25.5.0",
    "tree-sitter>=0.21.0,<0.22",
    "tree-sitter-languages>=1.10.2",
    "typer>=0.25.1",
    "gitpython>=3.1.0",
    "flagembedding>=1.4.0",
]

[project.scripts]
codemind = "codemind.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
